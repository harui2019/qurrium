[build-system]
requires = ["pytest", "setuptools", "setuptools-rust", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qurrium"
dynamic = ["version", "readme"]
description = "Qurrium 📏 - The Measuring Tool for Renyi Entropy, Loschmidt Echo, and Magnetization Squared, The Library of Some Common Cases"
authors = [{ name = "Huai-Chung Chang", email = "harui2019@proton.me" }]
license = "Apache-2.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
    "qiskit>=0.45.0",
    # We won't guarantee the compatibility of Qurrium with Qiskit versions lower than 1.0.0.
    # You should consider to upgrade them if you are still there.
    "requests",
    "tqdm",
]

[project.optional-dependencies]
qiskit-aer = ["qiskit-aer>=0.12.0"]
dev = [
    "setuptools",
    "setuptools-rust",
    # Lint tools
    "ruff",   # Also formatter, but we still keep pylint for it still supports more rules than ruff.
    "pep440",
    "pylint",
    # Test tools
    "pytest",
    "pytest-xdist",
    "pytest-order",
    "pytest-cov",
    "coverage",
]


[project.urls]
Issues = "https://github.com/qurrium/qurrium/issues"
Homepage = "https://github.com/qurrium/qurrium"
Documentation = "https://docs.qurrium.org"

[tool.distutils.bdist_wheel]
py-limited-api = "cp310"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ['qurry*']
exclude = ['cmake', 'symengine', 'tests']

[tool.setuptools.dynamic]
version = { file = "qurry/VERSION.txt" }
readme = { file = "README.md", content-type = "text/markdown" }

[[tool.setuptools-rust.ext-modules]]
target = 'qurry.boorust'
path = 'crates/boorust/Cargo.toml'

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
build = ["cp3??-*"]
skip = [
    "pp*",            # Qiskit and Qurrium are not pure python packages, See https://github.com/qurrium/qurry/issues/93#issuecomment-1801837481
    "*-musllinux_*",  # Qiskit did not support musllinux for it lacks some dependencies for mathematical operations.
    "cp314-*_i686",   # Python 3.14 is deprecated for 32-bit systems.
    "cp314-*aarch64", # Qiskit Aer is not yet published for Python 3.14 Aarch64, See https://github.com/Qiskit/qiskit-aer/issues/2419.
]
test-skip = [
    "*win32",
    "*_i686",
] # If you still use 32-bit system. Consider to upgrade your hardware.
environment = { PATH = "$HOME/.cargo/bin:$PATH", RUSTUP_TOOLCHAIN = "stable" }
before-build = [
    'echo "======================================================================"',
    'echo "### Building ........................................................."',
    'echo "======================================================================"',
    'echo "| Which Python: "',
    'python -c "import sys; print(sys.executable)"',
    'python -c "from sysconfig import get_platform; print(get_platform())" || echo "| Failed to get platform..."',
    'echo "| Python Version: "',
    'python --version',
    'echo "| Platform: "',
    'python -c "import platform; print(platform.platform())"',
    'echo "| Prepare build environment..."',
    "pip install --upgrade pipenv wheel pip",
    "pip install --upgrade auditwheel auditwheel-symbols delocate",
    "pip install --upgrade setuptools_rust setuptools wheel pkginfo",
    'echo "| Build environment prepared"',
]
before-test = [
    'echo "======================================================================"',
    'echo "### Testing Environment Preparing ...................................."',
    'echo "======================================================================"',
    'echo "| Install dependencies and {project}..."',
    "pip install --prefer-binary --only-binary=numpy,scipy numpy scipy",
    # Numpy and Scipy need to install separately.
    'cd {project} && pip install ".[dev,qiskit-aer]" --upgrade && cd ..',
    'echo "| Dependencies and {project} installed"',
]
test-command = [
    'echo "======================================================================"',
    'echo "### Test Start ......................................................."',
    'echo "======================================================================"',
    "pytest -n auto {project}/tests || pytest {project}/tests",
]

[tool.cibuildwheel.linux]
before-all = [
    'echo "======================================================================"',
    'echo "### Linux Setup ......................................................"',
    'echo "======================================================================"',
    'echo "| Clear .so files"',
    "find . -name '*.so' -delete",
    "find . -wholename '*/build' | xargs rm -rf",
    "find . -name 'dist' && rm -rf dist",
    "find . -name 'qurry.egg-info' && rm -rf qurry.egg-info",
    "find . -wholename '*/__pycache__' | xargs rm -rf",
    "find . -name 'target' && rm -rf target",
    "echo ''",
    'echo "| Installing Rust..."',
    "yum -y install libatomic",
    "command -v rustc >/dev/null 2>&1 || curl https://sh.rustup.rs -sSf | sh -s -- --profile=minimal -y",
    'command -v rustc >/dev/null 2>&1 || source "$HOME/.cargo/env"',
    "rustup show",
    'echo "| Rust ready"',
]

[tool.cibuildwheel.macos]
environment = "MACOSX_DEPLOYMENT_TARGET=10.12"
before-all = [
    'echo "======================================================================"',
    'echo "### MacOS Setup ......................................................"',
    'echo "======================================================================"',
    'echo "| Clear .so files"',
    "find . -name '*.so' -delete",
    "find . -wholename '*/build' | xargs rm -rf",
    "find . -name 'dist' && rm -rf dist",
    "find . -name 'qurry.egg-info' && rm -rf qurry.egg-info",
    "find . -wholename '*/__pycache__' | xargs rm -rf",
    "find . -name 'target' && rm -rf target",
    "echo ''",
    'echo "| Installing Rust..."',
    "command -v rustc >/dev/null 2>&1 || curl https://sh.rustup.rs -sSf | bash -s -- --profile=minimal -y",
    'command -v rustc >/dev/null 2>&1 || source "$HOME/.cargo/env"',
    "rustup show",
    'echo "| Rust ready"',
    # "rustup target add x86_64-apple-darwin",
    # "rustup target add aarch64-apple-darwin",
    'echo "| Preparing other macOS dedicated tools..."',
    "pip install delocate pipx",
    'echo "| Other macOS dedicated tools prepared"',
]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel} && pipx run abi3audit --strict --report {wheel}"
# Attention: If you are building universal2 binaries, 
# confirm that you are using universal2 Python since version 3.10
# It can be check by `python -c "from setuptools._distutils.util import get_platform; print(get_platform())"`
# You should see something like `macosx-*-universal2` in the output.

[tool.cibuildwheel.windows]
# PowerShell script
# before-all = [
#     'Write-Host "Downloading..."',
#     "Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe",
#     'Write-Host "Installing Rust..." -ForegroundColor Cyan',
#     'Start-Process -FilePath .\rustup-init.exe -ArgumentList "--profile minimal -y" -NoNewWindow -Wait',
#     'Remove-Item .\rustup-init.exe',
#     '$env:Path = "$env:USERPROFILE\.cargo\bin"',
#     "rustup show",
# ]

# CMD script
before-all = [
    'echo "======================================================================"',
    'echo "### Windows Setup ...................................................."',
    'echo "======================================================================"',
    'echo "| Clear .so files"',
    'for /r %i in (*.so) do del %i',
    'rmdir /s /q build',
    'rmdir /s /q dist',
    'rmdir /s /q qurry.egg-info',
    'rmdir /s /q qurry\__pycache__',
    'rmdir /s /q qurry\capsule\__pycache__',
    'rmdir /s /q target',
    "echo ''",
    'echo "| Downloading Rust..."',
    "curl -o rustup-init.exe https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe",
    'echo "| Installing Rust..."',
    "rustup-init.exe --profile minimal -y",
    "del rustup-init.exe",
    'set PATH=%USERPROFILE%\.cargo\bin;%PATH%',
    "rustup show",
    'echo "| Rust ready"',
]
before-build = [
    'echo "======================================================================"',
    'echo "### Building ........................................................."',
    'echo "======================================================================"',
    'echo "| Prepare build environment..."',
    "python -m pip install --upgrade pipenv wheel pip",
    "python -m pip install --upgrade auditwheel auditwheel-symbols delocate",
    "python -m pip install --upgrade setuptools_rust setuptools wheel pkginfo",
    'echo "| Build environment prepared..."',
]
test-command = [
    'echo "======================================================================"',
    'echo "### Test Start ......................................................."',
    'echo "======================================================================"',
    "pytest {project}/tests",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
# Qiskit DeprecationWarning is very annoying,
# it can raise 100k+ warnings in a single test. WTF?

log_cli = false
testpaths = ["tests"]

[tool.coverage.run]
include = ["./qurry/*"]
omit = ["./tests/*"]
data_file = "./.coverage/.coverage"

# Linter and Formatter Configuration
# Pylint and Ruff are used for linting and formatting.
# We keep Pylint for it still supports more rules than Ruff.
[tool.pylint]
ignore-patterns = [".*\\.pyi"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-parents = 10

[tool.pylint.similarities]
ignore-docstrings = true
ignore-comments = true
min-similarity-lines = 6

[tool.pylint."messages control"]
disable = [
    "duplicate-code",                # R0801, Required further research
    "too-many-instance-attributes",  # R0902
    "too-few-public-methods",        # R0903
    "too-many-public-methods",       # R0904
    "too-many-branches",             # R0912
    "too-many-arguments",            # R0913
    "too-many-locals",               # R0914
    "too-many-statements",           # R0915
    "too-many-positional-arguments", # R0917
    "too-many-nested-blocks",        # R1702
    "fixme",                         # W0511, We will fix them in the future, but not now.
]
# Respecting command line options of pylint
# This will be useful when you configure pylint in your IDE
# pylint ./qurry
# --max-line-length=100 --max-parents=10
# --ignore-docstrings --ignore-comments --min-similarity-lines=6
# --disable=R0801,R0902,R0903,R0904,R0912,R0913,R0914,R0915,R0917,R1702


[tool.ruff]
line-length = 100
target-version = "py310"
# We only support Python 3.10+, this is the minimum version.
# This will need to be updated when we start to support Python 3.10+ specific syntax.

lint.select = [
    "E4",
    "E7",
    "E9", # pycodestyle errors
    "F",  # Pyflakes
]
lint.ignore = ["F401", "E203", "W291", "F841"]
lint.extend-select = ["E501"]
# Ruff is intentionally to ignore the check of line length
# See: https://github.com/astral-sh/ruff/issues/6424#issuecomment-2079623192

[tool.ruff.lint.per-file-ignores]
# "**/{tests,docs,tools}/*" = ["E402"]
"__init__.py" = ["E402", "F401"]
# module level import of this package need before boorust setup
"qurry/process/utils/dummy.py" = ["E731"]
# The only file allows lambda assignment for a specific function

# Respecting command line options of ruff
# This will be useful when you configure ruff in your IDE
# ruff check 
# --line-length=100 --target-version=py310 --select=E4,E7,E9,F 
# --ignore=F401,E203,W291,F841 --extend-select=E501 ./qurry
# Or with format:
# ruff format --line-length=100 ./qurry
